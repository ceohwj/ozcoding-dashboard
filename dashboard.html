<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>호흡기 진료비 격차 모니터</title>
  <link rel="stylesheet" href="src/css/style.css?v=2">
</head>
<body>
  <main class="page" id="app">
    <header>
      <h1>호흡기 진료비 격차 모니터</h1>
      <p class="take" id="take"></p>
      <p class="sub" id="sub"></p>
    </header>

    <section class="kpis" id="kpis" aria-label="요약 지표"></section>

    <section class="grid2">
      <div class="card">
        <h2>종별 × 보험료 분위 평균 진료비</h2>
        <p class="note">세로는 기관 종별, 가로는 환자의 보험료 분위(1 낮음 ~ 5 높음). 칸의 숫자는 건당 평균(만 원), 아래는 건수. 진하기는 금액.</p>
        <div class="heat" id="heat"></div>
      </div>
      <div class="card">
        <h2>보험료 분위별 건당 평균</h2>
        <p class="note">종별을 섞은 전체 평균이라 분위 간 차이는 종별 구성에 영향을 받는다.</p>
        <div class="chart" id="q-chart"></div>
      </div>
    </section>

    <section class="grid2">
      <div class="card">
        <h2>월별 호흡기 외래 건수</h2>
        <p class="note">월 단위 명세서 건수.</p>
        <div class="chart" id="m-n"></div>
      </div>
      <div class="card">
        <h2>월별 건당 평균 진료비</h2>
        <p class="note">0원부터 시작하는 축.</p>
        <div class="chart" id="m-mean"></div>
      </div>
    </section>

    <section class="card">
      <h2>기관별 건당 중앙값 진료비</h2>
      <p class="note" id="inst-note"></p>
      <div class="tbox">
        <table id="inst-table">
          <thead><tr>
            <th data-k="inst_id">기관 ID</th>
            <th data-k="tier">종별</th>
            <th data-k="region">권역</th>
            <th data-k="n" class="r">청구 건수</th>
            <th data-k="median" class="r">건당 중앙값(원)</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="card method" id="method"></section>
    <div class="tip" id="tip" hidden></div>
  </main>
  <script type="module" src="src/js/main.js?v=2"></script>
</body>
</html>
